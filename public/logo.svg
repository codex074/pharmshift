<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <clipPath id="pillClip">
      <rect x="-70" y="-28" width="140" height="56" rx="28"/>
    </clipPath>
    <clipPath id="calBody">
      <rect x="-95" y="-70" width="190" height="155" rx="18"/>
    </clipPath>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#4c1d95" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4c1d95" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle ring decoration -->
  <circle cx="256" cy="215" r="130" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="50"/>

  <!-- Calendar -->
  <g transform="translate(256, 205)" filter="url(#shadow1)">
    <!-- Calendar body -->
    <rect x="-95" y="-70" width="190" height="155" rx="18" fill="white"/>
    <!-- Calendar header bar -->
    <g clip-path="url(#calBody)">
      <rect x="-95" y="-70" width="190" height="48" fill="#ede9fe"/>
    </g>
    <!-- Calendar rings -->
    <rect x="-55" y="-82" width="12" height="26" rx="6" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="43" y="-82" width="12" height="26" rx="6" fill="white" stroke="#c4b5fd" stroke-width="2"/>
    <!-- Grid dots row 1 -->
    <circle cx="-58" cy="-10" r="5" fill="#ddd6fe"/>
    <circle cx="-28" cy="-10" r="5" fill="#ddd6fe"/>
    <circle cx="2" cy="-10" r="5" fill="#ddd6fe"/>
    <circle cx="32" cy="-10" r="5" fill="#ddd6fe"/>
    <circle cx="62" cy="-10" r="5" fill="#ddd6fe"/>
    <!-- Grid dots row 2 -->
    <circle cx="-58" cy="20" r="5" fill="#ddd6fe"/>
    <circle cx="-28" cy="20" r="5" fill="#ddd6fe"/>
    <circle cx="2" cy="20" r="5" fill="#8b5cf6"/>
    <circle cx="32" cy="20" r="5" fill="#ddd6fe"/>
    <circle cx="62" cy="20" r="5" fill="#ddd6fe"/>
    <!-- Grid dots row 3 -->
    <circle cx="-58" cy="50" r="5" fill="#ddd6fe"/>
    <circle cx="-28" cy="50" r="5" fill="#ddd6fe"/>
    <circle cx="2" cy="50" r="5" fill="#ddd6fe"/>
    <circle cx="32" cy="50" r="5" fill="#ddd6fe"/>
    <circle cx="62" cy="50" r="5" fill="#ddd6fe"/>
    <!-- Active date highlight -->
    <circle cx="2" cy="20" r="12" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- Pill capsule overlapping calendar -->
  <g transform="translate(330, 160) rotate(-40)" filter="url(#shadow2)">
    <rect x="-70" y="-28" width="140" height="56" rx="28" fill="white"/>
    <g clip-path="url(#pillClip)">
      <rect x="0" y="-28" width="70" height="56" fill="#ede9fe"/>
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#c4b5fd" stroke-width="1.5"/>
    </g>
    <rect x="-55" y="-22" width="38" height="8" rx="4" fill="white" opacity="0.5"/>
  </g>

  <!-- Text: เวรดี๊ดี (using Mitr font — cute rounded Japanese-kawaii style) -->
  <text x="256" y="418" text-anchor="middle" font-family="Mitr, 'Noto Sans Thai', Thonburi, sans-serif" font-size="65" font-weight="600" fill="white" letter-spacing="3" paint-order="stroke" stroke="rgba(91,33,182,0.3)" stroke-width="2">เวรดี๊ดี</text>
</svg>

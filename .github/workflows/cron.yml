name: Cron Jobs

on:
  schedule:
    # ── Shift Reminders ────────────────────────────────────────
    # 23:00 UTC = 06:00 Bangkok  →  แจ้งเตือนเวรวันนี้ (ยกเว้นรุ่งอรุณ)
    - cron: '0 23 * * *'
    # 09:00 UTC = 16:00 Bangkok  →  แจ้งเตือนเวรพรุ่งนี้ (ทุกประเภท) + เวรดึกคืนนี้
    - cron: '0 9 * * *'
    # ── Cleanup ────────────────────────────────────────────────
    # 21:00 UTC = 04:00 Bangkok  →  ลบข้อมูลเก่า
    - cron: '0 21 * * *'

  # รันมือได้จาก GitHub Actions tab (ใช้ทดสอบ)
  workflow_dispatch:
    inputs:
      job:
        description: 'เลือก job ที่ต้องการรัน'
        required: true
        default: 'reminders'
        type: choice
        options:
          - reminders
          - night-reminders
          - cleanup
          - all

jobs:
  # ─────────────────────────────────────────────────────────────
  # แจ้งเตือนเวร (06:00 + 16:00 Bangkok)
  # ─────────────────────────────────────────────────────────────
  shift-reminders:
    name: Shift Reminders
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'reminders' || github.event.inputs.job == 'all')
      || (
        github.event_name == 'schedule' &&
        (github.event.schedule == '0 23 * * *' || github.event.schedule == '0 9 * * *')
      )
    steps:
      - name: Determine run type
        id: run_type
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "0 23 * * *" ]; then
            echo "run=morning" >> $GITHUB_OUTPUT
          else
            echo "run=evening" >> $GITHUB_OUTPUT
          fi

      - name: Call shift-reminders API
        run: |
          RUN_TYPE="${{ steps.run_type.outputs.run }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -X GET "${{ secrets.APP_URL }}/api/cron/shift-reminders?run=${RUN_TYPE}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "Run type : $RUN_TYPE"
          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "✅ Shift reminders ($RUN_TYPE) sent successfully"
          else
            echo "❌ Failed with status $RESPONSE"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # แจ้งเตือนเวรดึกคืนนี้ (16:00 Bangkok)
  # ─────────────────────────────────────────────────────────────
  night-shift-reminders:
    name: Night Shift Reminders
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'night-reminders' || github.event.inputs.job == 'all')
      || (
        github.event_name == 'schedule' &&
        github.event.schedule == '0 9 * * *'
      )
    steps:
      - name: Call night shift reminder API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -X GET "${{ secrets.APP_URL }}/api/cron/shift-reminders?run=night" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "Run type : night"
          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "✅ Night shift reminders sent successfully"
          else
            echo "❌ Failed with status $RESPONSE"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # ลบข้อมูลเก่า (04:00 Bangkok)
  # ─────────────────────────────────────────────────────────────
  cleanup:
    name: Cleanup Old Data
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'cleanup' || github.event.inputs.job == 'all')
      || (
        github.event_name == 'schedule' &&
        github.event.schedule == '0 21 * * *'
      )
    steps:
      - name: Call cleanup API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -X GET "${{ secrets.APP_URL }}/api/cron/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "✅ Cleanup completed successfully"
          else
            echo "❌ Failed with status $RESPONSE"
            exit 1
          fi
